name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build CLI binary
        run: go build -trimpath -o astra ./cmd/astra

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: astra-linux-amd64
          path: astra
          if-no-files-found: error

      - name: Test
        run: go test ./...

  release:
    name: Release binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/astra-linux-amd64 ./cmd/astra
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/astra-darwin-arm64 ./cmd/astra
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/astra-windows-amd64.exe ./cmd/astra

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astra-binaries
          path: dist/
